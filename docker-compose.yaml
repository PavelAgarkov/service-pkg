name: service-pkg

services:
  redis:
    image: redis:7.2.1
    hostname: redis
    container_name: service-pkg-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - qwerty12345
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    environment:
      REDISCLI_AUTH: qwerty12345
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      retries: 2
      timeout: 2s
    networks:
      - service-pkg

  # Host Sentinel cluster — доступ из GoLand через localhost
  redis-sentinel-master:
    image: redis:7.2.1
    hostname: redis-sentinel-master
    container_name: service-pkg-redis-sentinel-master
    network_mode: host
    command:
      - redis-server
      - --port
      - "6381"
      - --bind
      - "127.0.0.1"
      - --requirepass
      - qwerty12345
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    environment:
      REDISCLI_AUTH: qwerty12345
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6381", "ping" ]
      interval: 2s
      retries: 5
      timeout: 2s

  redis-sentinel-replica:
    image: redis:7.2.1
    hostname: redis-sentinel-replica
    container_name: service-pkg-redis-sentinel-replica
    network_mode: host
    command:
      - redis-server
      - --port
      - "6382"
      - --bind
      - "127.0.0.1"
      - --requirepass
      - qwerty12345
      - --masterauth
      - qwerty12345
      - --replicaof
      - "127.0.0.1"
      - "6381"
      - --replica-announce-ip
      - "127.0.0.1"
      - --replica-announce-port
      - "6382"
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    environment:
      REDISCLI_AUTH: qwerty12345
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6382", "ping" ]
      interval: 2s
      retries: 5
      timeout: 2s

  redis-sentinel:
    image: redis:7.2.1
    hostname: redis-sentinel
    container_name: service-pkg-redis-sentinel
    network_mode: host
    environment:
      REDISCLI_AUTH: qwerty12345
    command: >
      sh -c '
        echo "port 26379" > /tmp/sentinel.conf &&
        echo "bind 127.0.0.1" >> /tmp/sentinel.conf &&
        echo "requirepass qwerty12345" >> /tmp/sentinel.conf &&
        echo "sentinel monitor mymaster 127.0.0.1 6381 1" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster qwerty12345" >> /tmp/sentinel.conf &&
        echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf &&
        echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf &&
        echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      '
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
      redis-sentinel-replica:
        condition: service_healthy
    restart: unless-stopped

  # Docker Sentinel cluster — доступ по Docker DNS
  redis-sentinel-docker-master:
    image: redis:7.2.1
    hostname: redis-sentinel-docker-master
    container_name: service-pkg-redis-sentinel-docker-master
    command:
      - redis-server
      - --requirepass
      - qwerty12345
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    environment:
      REDISCLI_AUTH: qwerty12345
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      retries: 5
      timeout: 2s
    networks:
      - service-pkg

  redis-sentinel-docker-replica:
    image: redis:7.2.1
    hostname: redis-sentinel-docker-replica
    container_name: service-pkg-redis-sentinel-docker-replica
    command:
      - redis-server
      - --requirepass
      - qwerty12345
      - --masterauth
      - qwerty12345
      - --replicaof
      - redis-sentinel-docker-master
      - "6379"
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    environment:
      REDISCLI_AUTH: qwerty12345
    depends_on:
      redis-sentinel-docker-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      retries: 5
      timeout: 2s
    networks:
      - service-pkg

  redis-sentinel-docker:
    image: redis:7.2.1
    hostname: redis-sentinel-docker
    container_name: service-pkg-redis-sentinel-docker
    environment:
      REDISCLI_AUTH: qwerty12345
    command: >
      sh -c '
        echo "port 26379" > /tmp/sentinel.conf &&
        echo "requirepass qwerty12345" >> /tmp/sentinel.conf &&
        echo "sentinel resolve-hostnames yes" >> /tmp/sentinel.conf &&
        echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf &&
        echo "sentinel monitor mymaster-docker redis-sentinel-docker-master 6379 1" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster-docker qwerty12345" >> /tmp/sentinel.conf &&
        echo "sentinel down-after-milliseconds mymaster-docker 5000" >> /tmp/sentinel.conf &&
        echo "sentinel failover-timeout mymaster-docker 10000" >> /tmp/sentinel.conf &&
        echo "sentinel parallel-syncs mymaster-docker 1" >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      '
    depends_on:
      redis-sentinel-docker-master:
        condition: service_healthy
      redis-sentinel-docker-replica:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - service-pkg

  postgres:
    image: postgres:15.0
    hostname: postgres
    container_name: service-pkg-postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty12345
      POSTGRES_DB: postgres
    restart: unless-stopped
    networks:
      - service-pkg

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    hostname: zookeeper
    container_name: service-pkg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: unless-stopped
    networks:
      - service-pkg

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    container_name: service-pkg-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "cub kafka-ready -b localhost:9092 1 10 >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - service-pkg

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: service-pkg-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - service-pkg

  mongo1:
    image: mongo:8.0
    hostname: mongo1
    container_name: service-pkg-mongodb-1
    environment:
      MONGO_INITDB_DATABASE: mlp
    restart: unless-stopped
    ports:
      - "27017:27017"
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--port"
      - "27017"
    logging:
      driver: none
    networks:
      - service-pkg
    volumes:
      - mongo1-data:/data/db

  mongo2:
    image: mongo:8.0
    hostname: mongo2
    container_name: service-pkg-mongodb-2
    environment:
      MONGO_INITDB_DATABASE: mlp
    restart: unless-stopped
    ports:
      - "27018:27018"
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--port"
      - "27018"
    logging:
      driver: none
    networks:
      - service-pkg
    volumes:
      - mongo2-data:/data/db

  mongosetup:
    image: mongo:8.0
    container_name: service-pkg-mongodb-setup
    depends_on:
      - mongo1
      - mongo2
    restart: "no"
    entrypoint: >
      bash -c "sleep 10 && mongosh --host mongo1:27017 --eval '
      rs.initiate({
        _id: \"rs0\",
        version: 1,
        members: [
          { _id: 0, host: \"mongo1:27017\" },
          { _id: 1, host: \"mongo2:27018\" }
        ]
      });'"
    networks:
      - service-pkg

volumes:
  mongo1-data:
    name: service-pkg-mongo1-data

  mongo2-data:
    name: service-pkg-mongo2-data

  pgdata:
    name: service-pkg-postgres-data

  zookeeper_data:
    name: service-pkg-zookeeper-data

  zookeeper_log:
    name: service-pkg-zookeeper-log

  kafka_data:
    name: service-pkg-kafka-data

networks:
  service-pkg:
    name: service-pkg
    driver: bridge
    external: true
